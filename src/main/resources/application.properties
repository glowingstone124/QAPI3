spring.main.web-application-type=reactive
spring.webflux.static-path-pattern=/not-accessible/**

spring.threads.virtual.enabled=true

# Database credentials and URL are read from data/sql/info.json. Existing
# jdbc:mysql URLs are converted to r2dbc:mysql when the connection pool starts.

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.threaddump.enabled=false
management.endpoint.metrics.enabled=false

spring.codec.max-in-memory-size=256KB
server.max-http-request-header-size=16KB
qapi.cors.allowed-origins=*
qapi.registration.chambers-node-names=${CHAMBERS_NODE_NAMES:chambers}
qapi.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}
